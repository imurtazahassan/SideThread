<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><defs><linearGradient id="g_midnight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#b36cff"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter><linearGradient id="bgfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12141c"/><stop offset="1" stop-color="#090a0e"/></linearGradient></defs><rect x="0" y="0" width="1200" height="620" rx="0" fill="url(#bgfade)" opacity="1" /><text x="300" y="56" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f87171" text-anchor="middle" opacity="1" letter-spacing="0" >Without SideThread</text><text x="900" y="56" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#4ade80" text-anchor="middle" opacity="1" letter-spacing="0" >With SideThread</text><rect x="598" y="80" width="2" height="500" rx="0" fill="#262a36" opacity="1" /><rect x="60" y="84" width="480" height="500" rx="16" fill="#0f1117" stroke="#262a36" stroke-width="1" opacity="1" /><text x="84" y="108" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b8bccb" text-anchor="start" opacity="1" letter-spacing="0" >Long answer: you don't understand this line</text><rect x="84" y="124" width="330" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="84" y="142" width="290" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="84" y="160" width="250" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="84" y="178" width="330" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="84" y="196" width="290" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="84" y="214" width="210" height="22" rx="6" fill="#7c6cff" opacity="0.4" /><text x="94" y="230" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f1f2f8" text-anchor="start" opacity="1" letter-spacing="0" >the confusing line</text><rect x="84" y="252" width="380" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="84" y="270" width="330" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="84" y="288" width="280" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="84" y="306" width="230" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="84" y="324" width="380" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="84" y="342" width="330" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="84" y="372" width="200" height="10" rx="5" fill="#1c202c" opacity="1" /><rect x="84" y="396" width="340" height="8" rx="4" fill="#1c202c" opacity="1" /><rect x="84" y="414" width="300" height="8" rx="4" fill="#1c202c" opacity="1" /><rect x="84" y="450" width="380" height="70" rx="12" fill="#171a24" stroke="#f87171" stroke-width="1.5" opacity="1" /><text x="98" y="474" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#fca5a5" text-anchor="start" opacity="1" letter-spacing="0" >Your follow-up answer ends up</text><text x="98" y="494" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#fca5a5" text-anchor="start" opacity="1" letter-spacing="0" >here, at the very bottom.</text><rect x="514" y="96" width="8" height="476" rx="4" fill="#171a24" opacity="1" /><rect x="514" y="470" width="8" height="90" rx="4" fill="#4a5068" opacity="1" /><path d="M470 236 C 560 280, 560 420, 480 470" stroke="#f87171" stroke-width="2.5" fill="none" stroke-dasharray="6 6" stroke-linecap="round"/><path d="M488 462 L478 472 L492 474" stroke="#f87171" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="560" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#9aa0b4" text-anchor="middle" opacity="1" letter-spacing="0" >Scroll down, read, scroll back up. Again and again.</text><rect x="640" y="84" width="230" height="500" rx="16" fill="#0f1117" stroke="#262a36" stroke-width="1" opacity="1" /><text x="656" y="108" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b8bccb" text-anchor="start" opacity="1" letter-spacing="0" >Long answer</text><rect x="656" y="124" width="190" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="656" y="142" width="160" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="656" y="160" width="130" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="656" y="178" width="190" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="656" y="196" width="160" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="656" y="214" width="150" height="22" rx="6" fill="#7c6cff" opacity="0.4" /><text x="664" y="230" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f1f2f8" text-anchor="start" opacity="1" letter-spacing="0" >the confusing line</text><rect x="656" y="252" width="196" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="656" y="270" width="160" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="656" y="288" width="124" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="656" y="306" width="88" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="656" y="324" width="196" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="656" y="342" width="160" height="8" rx="4" fill="#2a2f40" opacity="1" /><rect x="656" y="372" width="170" height="8" rx="4" fill="#1c202c" opacity="1" /><rect x="656" y="390" width="140" height="8" rx="4" fill="#1c202c" opacity="1" /><rect x="656" y="408" width="110" height="8" rx="4" fill="#1c202c" opacity="1" /><rect x="656" y="426" width="170" height="8" rx="4" fill="#1c202c" opacity="1" /><text x="755" y="560" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa0b4" text-anchor="middle" opacity="1" letter-spacing="0" >Chat stays put</text><path d="M810 225 C 840 225, 850 195, 884 190" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-dasharray="6 6" stroke-linecap="round"/><path d="M874 182 L886 190 L873 197" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(892 84) scale(.72)"><g filter="url(#shadow)"><rect x="0" y="0" width="380" height="620" rx="18" fill="#0e1016" stroke="#272b38" stroke-width="1" opacity="1" /></g><rect x="16" y="16" width="28" height="28" rx="9" fill="url(#g_midnight)" opacity="1" /><circle cx="30" cy="30" r="6" fill="#ffffff" opacity=".95"/><text x="54" y="36" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e9ebf3" text-anchor="start" opacity="1" letter-spacing="0" >SideThread</text><rect x="252" y="18" width="24" height="24" rx="7" fill="#1f2330" opacity="1" /><circle cx="264" cy="30" r="2.6" fill="#8a90a6"/><rect x="282" y="18" width="24" height="24" rx="7" fill="#1f2330" opacity="1" /><circle cx="294" cy="30" r="2.6" fill="#8a90a6"/><rect x="312" y="18" width="24" height="24" rx="7" fill="#1f2330" opacity="1" /><circle cx="324" cy="30" r="2.6" fill="#8a90a6"/><rect x="342" y="18" width="24" height="24" rx="7" fill="#1f2330" opacity="1" /><circle cx="354" cy="30" r="2.6" fill="#8a90a6"/><rect x="16" y="60" width="38" height="24" rx="12" fill="url(#g_midnight)" opacity="1" /><text x="35" y="76" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1" letter-spacing="0" >Q1</text><rect x="60" y="60" width="38" height="24" rx="12" fill="#171a24" stroke="#272b38" stroke-width="1" opacity="1" /><text x="79" y="76" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#8a90a6" text-anchor="middle" opacity="1" letter-spacing="0" >Q2</text><rect x="104" y="60" width="38" height="24" rx="12" fill="#171a24" stroke="#272b38" stroke-width="1" opacity="1" /><text x="123" y="76" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#8a90a6" text-anchor="middle" opacity="1" letter-spacing="0" >Q3</text><rect x="16" y="100" width="348" height="98" rx="14" fill="#171a24" stroke="#272b38" stroke-width="1" opacity="1" /><rect x="16" y="114" width="3" height="70" rx="2" fill="url(#g_midnight)" opacity="1" /><text x="32" y="123" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#7c6cff" text-anchor="start" opacity="1" letter-spacing="1" >SELECTED TEXT</text><text x="32" y="146" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e9ebf3" text-anchor="start" opacity="0.88" letter-spacing="0" >moving the parameters in the direction of the</text><text x="32" y="165" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e9ebf3" text-anchor="start" opacity="0.88" letter-spacing="0" >steepest descent, scaled by a learning rate.</text><text x="32" y="184" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#7c6cff" text-anchor="start" opacity="1" letter-spacing="0" style="display:none">Jump to it  ↗</text><rect x="150" y="214" width="214" height="40" rx="14" fill="url(#g_midnight)" opacity="1" /><text x="164" y="239" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start" opacity="1" letter-spacing="0" >Explain this in simple words.</text><rect x="16" y="270" width="336" height="156" rx="14" fill="#171a24" stroke="#272b38" stroke-width="1" opacity="1" /><text x="30" y="297" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e9ebf3" text-anchor="start" opacity="1" letter-spacing="0" >Imagine walking downhill in thick fog.</text><text x="30" y="319" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e9ebf3" text-anchor="start" opacity="1" letter-spacing="0" >You can't see the bottom, so you feel the</text><text x="30" y="341" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e9ebf3" text-anchor="start" opacity="1" letter-spacing="0" >slope under your feet and take a small</text><text x="30" y="363" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e9ebf3" text-anchor="start" opacity="1" letter-spacing="0" >step down. Repeat until the ground is flat.</text><text x="30" y="397" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7c6cff" text-anchor="start" opacity="1" letter-spacing="0" >Learning rate = how big each step is.</text><rect x="16" y="520" width="104" height="28" rx="14" fill="#171a24" stroke="#272b38" stroke-width="1" opacity="1" /><text x="68.0" y="538.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#e9ebf3" text-anchor="middle" opacity="1" letter-spacing="0" >Explain simply</text><rect x="128" y="520" width="116" height="28" rx="14" fill="#171a24" stroke="#272b38" stroke-width="1" opacity="1" /><text x="186.0" y="538.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#e9ebf3" text-anchor="middle" opacity="1" letter-spacing="0" >Give an example</text><rect x="252" y="520" width="52" height="28" rx="14" fill="#171a24" stroke="#272b38" stroke-width="1" opacity="1" /><text x="278.0" y="538.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#e9ebf3" text-anchor="middle" opacity="1" letter-spacing="0" >Why?</text><rect x="16" y="558" width="296" height="44" rx="14" fill="#171a24" stroke="#272b38" stroke-width="1" opacity="1" /><text x="30" y="585" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a90a6" text-anchor="start" opacity="1" letter-spacing="0" >Ask about the selected text...</text><rect x="320" y="558" width="44" height="44" rx="14" fill="url(#g_midnight)" opacity="1" /><path d="M335 588 L350 573 M350 573 L345 592 L341 584 L333 580 Z" stroke="#ffffff" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/></g><text x="1029" y="560" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa0b4" text-anchor="middle" opacity="1" letter-spacing="0" >Answer appears right beside it</text></svg>