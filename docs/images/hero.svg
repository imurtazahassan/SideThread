<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><linearGradient id="g_midnight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#b36cff"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter><linearGradient id="bgfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12141c"/><stop offset="1" stop-color="#090a0e"/></linearGradient></defs><rect x="0" y="0" width="1200" height="700" rx="0" fill="url(#bgfade)" opacity="1" /><rect x="30" y="30" width="1140" height="640" rx="16" fill="#0f1117" stroke="#262a36" stroke-width="1" opacity="1" /><rect x="30" y="30" width="1140" height="44" rx="16" fill="#151822" opacity="1" /><rect x="30" y="58" width="1140" height="16" rx="0" fill="#151822" opacity="1" /><circle cx="58" cy="52" r="6" fill="#ff5f57"/><circle cx="80" cy="52" r="6" fill="#febc2e"/><circle cx="102" cy="52" r="6" fill="#28c840"/><rect x="170" y="40" width="520" height="24" rx="12" fill="#0d0f15" opacity="1" /><text x="430" y="57" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7e849a" text-anchor="middle" opacity="1" letter-spacing="0" >any-ai-chat.example</text><text x="70" y="112" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8e94a8" text-anchor="start" opacity="1" letter-spacing="0" >AI Chat</text><rect x="70" y="130" width="330" height="38" rx="14" fill="#2a2f40" opacity="1" /><text x="88" y="154" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#e9ebf3" text-anchor="start" opacity="1" letter-spacing="0" >What is gradient descent?</text><text x="70" y="214" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#b8bccb" text-anchor="start" opacity="1" letter-spacing="0" textLength="492.4" lengthAdjust="spacingAndGlyphs">Gradient descent is an optimization algorithm that minimizes a loss</text><text x="70" y="244" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#b8bccb" text-anchor="start" opacity="1" letter-spacing="0" textLength="507.1" lengthAdjust="spacingAndGlyphs">function by iteratively moving the parameters in the direction of the</text><rect x="70" y="257" width="123.6" height="24" rx="5" fill="#7c6cff" opacity="0.4" /><text x="73" y="274" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f1f2f8" text-anchor="start" opacity="1" letter-spacing="0" textLength="117.6" lengthAdjust="spacingAndGlyphs">steepest descent</text><text x="194.6" y="274" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#b8bccb" text-anchor="start" opacity="1" letter-spacing="0" textLength="205.8" lengthAdjust="spacingAndGlyphs">, scaled by a learning rate.</text><text x="70" y="348" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#b8bccb" text-anchor="start" opacity="1" letter-spacing="0" textLength="455.7" lengthAdjust="spacingAndGlyphs">In practice, the gradient is computed with backpropagation and</text><text x="70" y="378" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#b8bccb" text-anchor="start" opacity="1" letter-spacing="0" textLength="374.8" lengthAdjust="spacingAndGlyphs">averaged over a mini-batch before each update step.</text><text x="70" y="438" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#b8bccb" text-anchor="start" opacity="1" letter-spacing="0" textLength="492.4" lengthAdjust="spacingAndGlyphs">The key hyperparameter is the learning rate: too large and training</text><text x="70" y="468" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#b8bccb" text-anchor="start" opacity="1" letter-spacing="0" textLength="249.9" lengthAdjust="spacingAndGlyphs">diverges, too small and it crawls.</text><g filter="url(#shadow)"><rect x="70" y="290" width="190" height="38" rx="19" fill="url(#g_midnight)" opacity="1" /></g><path d="M92 302 l3 -6 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3z" fill="#fff"/><text x="114" y="314" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="start" opacity="1" letter-spacing="0" >Ask on the side</text><rect x="70" y="590" width="600" height="48" rx="24" fill="#171a24" stroke="#262a36" stroke-width="1" opacity="1" /><text x="96" y="620" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6f7589" text-anchor="start" opacity="1" letter-spacing="0" >Message AI Chat...</text><g transform="translate(770 56)"><g filter="url(#shadow)"><rect x="0" y="0" width="380" height="620" rx="18" fill="#0e1016" stroke="#272b38" stroke-width="1" opacity="1" /></g><rect x="16" y="16" width="28" height="28" rx="9" fill="url(#g_midnight)" opacity="1" /><circle cx="30" cy="30" r="6" fill="#ffffff" opacity=".95"/><text x="54" y="36" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e9ebf3" text-anchor="start" opacity="1" letter-spacing="0" >SideThread</text><rect x="252" y="18" width="24" height="24" rx="7" fill="#1f2330" opacity="1" /><circle cx="264" cy="30" r="2.6" fill="#8a90a6"/><rect x="282" y="18" width="24" height="24" rx="7" fill="#1f2330" opacity="1" /><circle cx="294" cy="30" r="2.6" fill="#8a90a6"/><rect x="312" y="18" width="24" height="24" rx="7" fill="#1f2330" opacity="1" /><circle cx="324" cy="30" r="2.6" fill="#8a90a6"/><rect x="342" y="18" width="24" height="24" rx="7" fill="#1f2330" opacity="1" /><circle cx="354" cy="30" r="2.6" fill="#8a90a6"/><rect x="16" y="60" width="38" height="24" rx="12" fill="url(#g_midnight)" opacity="1" /><text x="35" y="76" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1" letter-spacing="0" >Q1</text><rect x="60" y="60" width="38" height="24" rx="12" fill="#171a24" stroke="#272b38" stroke-width="1" opacity="1" /><text x="79" y="76" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#8a90a6" text-anchor="middle" opacity="1" letter-spacing="0" >Q2</text><rect x="104" y="60" width="38" height="24" rx="12" fill="#171a24" stroke="#272b38" stroke-width="1" opacity="1" /><text x="123" y="76" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#8a90a6" text-anchor="middle" opacity="1" letter-spacing="0" >Q3</text><rect x="16" y="100" width="348" height="98" rx="14" fill="#171a24" stroke="#272b38" stroke-width="1" opacity="1" /><rect x="16" y="114" width="3" height="70" rx="2" fill="url(#g_midnight)" opacity="1" /><text x="32" y="123" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#7c6cff" text-anchor="start" opacity="1" letter-spacing="1" >SELECTED TEXT</text><text x="32" y="146" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e9ebf3" text-anchor="start" opacity="0.88" letter-spacing="0" >moving the parameters in the direction of the</text><text x="32" y="165" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e9ebf3" text-anchor="start" opacity="0.88" letter-spacing="0" >steepest descent, scaled by a learning rate.</text><text x="32" y="184" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#7c6cff" text-anchor="start" opacity="1" letter-spacing="0" style="display:none">Jump to it  ↗</text><rect x="150" y="214" width="214" height="40" rx="14" fill="url(#g_midnight)" opacity="1" /><text x="164" y="239" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start" opacity="1" letter-spacing="0" >Explain this in simple words.</text><rect x="16" y="270" width="336" height="156" rx="14" fill="#171a24" stroke="#272b38" stroke-width="1" opacity="1" /><text x="30" y="297" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e9ebf3" text-anchor="start" opacity="1" letter-spacing="0" >Imagine walking downhill in thick fog.</text><text x="30" y="319" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e9ebf3" text-anchor="start" opacity="1" letter-spacing="0" >You can't see the bottom, so you feel the</text><text x="30" y="341" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e9ebf3" text-anchor="start" opacity="1" letter-spacing="0" >slope under your feet and take a small</text><text x="30" y="363" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e9ebf3" text-anchor="start" opacity="1" letter-spacing="0" >step down. Repeat until the ground is flat.</text><text x="30" y="397" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7c6cff" text-anchor="start" opacity="1" letter-spacing="0" >Learning rate = how big each step is.</text><rect x="16" y="520" width="104" height="28" rx="14" fill="#171a24" stroke="#272b38" stroke-width="1" opacity="1" /><text x="68.0" y="538.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#e9ebf3" text-anchor="middle" opacity="1" letter-spacing="0" >Explain simply</text><rect x="128" y="520" width="116" height="28" rx="14" fill="#171a24" stroke="#272b38" stroke-width="1" opacity="1" /><text x="186.0" y="538.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#e9ebf3" text-anchor="middle" opacity="1" letter-spacing="0" >Give an example</text><rect x="252" y="520" width="52" height="28" rx="14" fill="#171a24" stroke="#272b38" stroke-width="1" opacity="1" /><text x="278.0" y="538.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#e9ebf3" text-anchor="middle" opacity="1" letter-spacing="0" >Why?</text><rect x="16" y="558" width="296" height="44" rx="14" fill="#171a24" stroke="#272b38" stroke-width="1" opacity="1" /><text x="30" y="585" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a90a6" text-anchor="start" opacity="1" letter-spacing="0" >Ask about the selected text...</text><rect x="320" y="558" width="44" height="44" rx="14" fill="url(#g_midnight)" opacity="1" /><path d="M335 588 L350 573 M350 573 L345 592 L341 584 L333 580 Z" stroke="#ffffff" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/></g><text x="70" y="664" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5c6174" text-anchor="start" opacity="1" letter-spacing="0" >Illustration with sample content</text></svg>